# 2026-10-30 正样本只读标定；仍需现场负例验收，不能识别红色物体身份。
backend: piperx
server_host: 192.168.50.2
server_port: 8103
language_instruction: grab the rotating red square
control_hz: 30
episode_steps: 200
admission_mode: manual # 系统始终判定；默认逐条人工审核，自动收录需显式选择。
watchdog_s: 0.5
rpc_timeout_s: null
feedback_timeout_s: 0.2
camera_timeout_s: 0.3
collection_config: configs/local/collection.yaml
# 按用户要求对齐baseline_fast/openpi的策略速度与单目标距离；固定归位仍为10%。
workspace_m: [[-0.02, 1.0], [-1.0, 1.0], [0.0, 1.0]]
max_translation_step_m: 0.3
max_rotation_step_rad: 0.5
gripper_range_m: [0.0, 0.10]
max_gripper_step_m: 0.10 # 允许合法范围内一次张合，与参考客户端一致。
speed_percent: 90
gripper_force_n: 1.0
success_detector: piperx_expo.client.success:GraspSuccessDetector
success_detector_config:
  height_m: 0.281807 # 成功样本z=0.286807m，下移5mm作为初始容差。
  gripper_width_m: [0.0346, 0.0386] # 成功样本0.0366m，初始宽度容差±2mm。
  consecutive_steps: 6 # 按实际动作步累计，重复RPC不能加速触发。
# 恢复使能允许CAN状态稍后到达；只在本次点击后的有界窗口重试，不后台永久使能。
enable_recovery_timeout_s: 3
manual_reset: true
home_config: configs/client/home.openpi.yaml
# 仅由本机GUI管理；复用机器人电脑已有的有线SSH连接，不保存密码/私钥。
remote_server:
  ssh_host: gh4090piper-wired
  project_dir: /data/gcj_data/rl/real_time_expo_ft/code
  config: configs/server/rotating_square.gui.yaml
