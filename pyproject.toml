[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piperx-realtime-expo-ft"
version = "0.1.0"
description = "Piper-X 客户端与 Real-Time EXPO-FT GPU 学习器适配"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy>=1.24,<2", "pillow>=10", "PyYAML>=6", "websockets~=13.1", "openpi-client", "h5py>=3.10"]

[project.scripts]
piperx-client = "piperx_expo.client.rpc:main"
piperx-server = "piperx_expo.server.launch:main"
piperx-convert = "piperx_expo.data.convert:main"
piperx-norm = "piperx_expo.data.norm:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
openpi-client = { path = "third_party/openpi/packages/openpi-client", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
